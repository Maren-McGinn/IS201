<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle Clone</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #121213;
        color: white;
    }

    h1 {
        margin-top: 20px;
    }

    #game {
        margin: 20px auto;
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        gap: 10px;
        width: 260px;
    }

    .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }

    .tile {
        width: 50px;
        height: 50px;
        border: 2px solid #3a3a3c;
        font-size: 24px;
        text-transform: uppercase;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #121213;
    }

    .correct {
        background-color: #538d4e;
        border: none;
    }

    .present {
        background-color: #3a7bd5;
        border: none;
    }

    .absent {
        background-color: #3a3a3c;
        border: none;
    }

    #message {
        margin-top: 15px;
        font-size: 18px;
    }

    #score {
        margin-top: 10px;
        font-size: 16px;
    }

    #playAgain {
        margin-top: 15px;
        padding: 10px 15px;
        font-size: 16px;
        display: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>Word Guess Game</h1>

<div id="score">Wins: 0 | Losses: 0</div>

<div id="game"></div>

<div id="message"></div>

<button id="playAgain" onclick="resetGame()">Play Again</button>

<script>
const words = [
    "apple","grape","peach","lemon","mango",
    "berry","charm","flame","crane","stone",
    "light","sound","dream","plant","water"
];

let targetWord;
let currentRow;
let currentCol;
let currentGuess;
const maxRows = 5;

let wins = 0;
let losses = 0;

// Create board
const game = document.getElementById("game");

function buildBoard() {
    game.innerHTML = "";
    for (let i = 0; i < maxRows; i++) {
        let row = document.createElement("div");
        row.classList.add("row");

        for (let j = 0; j < 5; j++) {
            let tile = document.createElement("div");
            tile.classList.add("tile");
            row.appendChild(tile);
        }

        game.appendChild(row);
    }
}

// Keyboard input
document.addEventListener("keydown", handleKey);

function handleKey(e) {
    if (currentRow >= maxRows) return;

    if (e.key === "Backspace") {
        if (currentCol > 0) {
            currentCol--;
            currentGuess[currentCol] = "";
            updateTiles();
        }
    } 
    else if (e.key === "Enter") {
        if (currentCol === 5) {
            submitGuess();
        }
    } 
    else if (/^[a-zA-Z]$/.test(e.key)) {
        if (currentCol < 5) {
            currentGuess[currentCol] = e.key.toLowerCase();
            currentCol++;
            updateTiles();
        }
    }
}

function updateTiles() {
    const row = game.children[currentRow];
    for (let i = 0; i < 5; i++) {
        row.children[i].textContent = currentGuess[i];
    }
}

function submitGuess() {
    const guess = currentGuess.join("");

    const row = game.children[currentRow];
    const tiles = row.children;

    let targetArray = targetWord.split("");
    let guessArray = guess.split("");

    // First pass
    for (let i = 0; i < 5; i++) {
        if (guess[i] === targetWord[i]) {
            tiles[i].classList.add("correct");
            targetArray[i] = null;
            guessArray[i] = null;
        }
    }

    // Second pass
    for (let i = 0; i < 5; i++) {
        if (guessArray[i]) {
            let index = targetArray.indexOf(guessArray[i]);
            if (index !== -1) {
                tiles[i].classList.add("present");
                targetArray[index] = null;
            } else {
                tiles[i].classList.add("absent");
            }
        }
    }

    if (guess === targetWord) {
        wins++;
        updateScore();
        setMessage("🎉 You got it!");
        endGame();
        return;
    }

    currentRow++;
    currentCol = 0;
    currentGuess = ["", "", "", "", ""];

    if (currentRow === maxRows) {
        losses++;
        updateScore();
        setMessage("Game over! Word was: " + targetWord.toUpperCase());
        endGame();
    }
}

function updateScore() {
    document.getElementById("score").textContent =
        `Wins: ${wins} | Losses: ${losses}`;
}

function setMessage(msg) {
    document.getElementById("message").textContent = msg;
}

function endGame() {
    document.getElementById("playAgain").style.display = "inline-block";
}

function resetGame() {
    targetWord = words[Math.floor(Math.random() * words.length)];
    currentRow = 0;
    currentCol = 0;
    currentGuess = ["", "", "", "", ""];

    buildBoard();
    setMessage("");
    document.getElementById("playAgain").style.display = "none";
}

// Initialize game
resetGame();
</script>

</body>
</html>
