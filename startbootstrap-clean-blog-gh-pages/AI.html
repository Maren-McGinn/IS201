<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle Clone</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #121213;
        color: white;
    }

    h1 {
        margin-top: 20px;
    }

    #game {
        margin: 20px auto;
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        gap: 10px;
        width: 260px;
    }

    .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }

    .tile {
        width: 50px;
        height: 50px;
        border: 2px solid #3a3a3c;
        font-size: 24px;
        text-transform: uppercase;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #121213;
    }

    .correct {
        background-color: #538d4e; /* green */
        border: none;
    }

    .present {
        background-color: #3a7bd5; /* blue */
        border: none;
    }

    .absent {
        background-color: #3a3a3c;
        border: none;
    }

    input {
        padding: 10px;
        font-size: 18px;
        text-transform: uppercase;
        width: 200px;
        text-align: center;
    }

    button {
        padding: 10px 15px;
        font-size: 16px;
        margin-left: 10px;
        cursor: pointer;
    }

    #message {
        margin-top: 15px;
        font-size: 18px;
    }
</style>
</head>
<body>

<h1>Word Guess Game</h1>

<div id="game"></div>

<div>
    <input id="guessInput" maxlength="5" placeholder="Enter word" />
    <button onclick="submitGuess()">Guess</button>
</div>

<div id="message"></div>

<script>
const words = [
    "apple","grape","peach","lemon","mango",
    "berry","charm","flame","crane","stone",
    "light","sound","dream","plant","water"
];

let targetWord = words[Math.floor(Math.random() * words.length)];
let currentRow = 0;
const maxRows = 5;

// Create board
const game = document.getElementById("game");
for (let i = 0; i < maxRows; i++) {
    let row = document.createElement("div");
    row.classList.add("row");

    for (let j = 0; j < 5; j++) {
        let tile = document.createElement("div");
        tile.classList.add("tile");
        row.appendChild(tile);
    }

    game.appendChild(row);
}

function submitGuess() {
    const input = document.getElementById("guessInput");
    const guess = input.value.toLowerCase();

    if (guess.length !== 5) {
        setMessage("Enter a 5-letter word.");
        return;
    }

    if (currentRow >= maxRows) return;

    const row = game.children[currentRow];
    const tiles = row.children;

    let targetArray = targetWord.split("");
    let guessArray = guess.split("");

    // First pass: correct positions
    for (let i = 0; i < 5; i++) {
        tiles[i].textContent = guess[i];

        if (guess[i] === targetWord[i]) {
            tiles[i].classList.add("correct");
            targetArray[i] = null;
            guessArray[i] = null;
        }
    }

    // Second pass: correct letters wrong position
    for (let i = 0; i < 5; i++) {
        if (guessArray[i]) {
            let index = targetArray.indexOf(guessArray[i]);
            if (index !== -1) {
                tiles[i].classList.add("present");
                targetArray[index] = null;
            } else {
                tiles[i].classList.add("absent");
            }
        }
    }

    if (guess === targetWord) {
        setMessage("🎉 You got it!");
        endGame();
        return;
    }

    currentRow++;
    input.value = "";

    if (currentRow === maxRows) {
        setMessage("Game over! Word was: " + targetWord.toUpperCase());
        endGame();
    }
}

function setMessage(msg) {
    document.getElementById("message").textContent = msg;
}

function endGame() {
    document.getElementById("guessInput").disabled = true;
}
</script>

</body>
</html>
